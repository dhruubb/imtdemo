<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF0F5">
<title>IMT Production</title>
<style>
@font-face{font-family:"SFD";src:url(data:font/woff;base64,__F400__) format("woff");font-weight:400;font-display:swap}
@font-face{font-family:"SFD";src:url(data:font/woff;base64,__F500__) format("woff");font-weight:500 600;font-display:swap}
@font-face{font-family:"SFD";src:url(data:font/woff;base64,__F700__) format("woff");font-weight:700 800;font-display:swap}
:root{
  --bg:#EDF0F5;--surface:#FFFFFF;--ink:#121A27;--ink2:#566170;--ink3:#8C95A2;--line:#E6E9EF;--fill:#F4F6F9;
  --cobalt:#18287A;--cobalt2:#22389E;
  --blue:#2A4FE0;--blue-soft:#E8EDFD;
  --red:#D23C2F;--red-soft:#FCEBE9;
  --amber:#B57400;--amber-soft:#FCF1D9;
  --green:#21894B;--green-soft:#E2F4E9;
  --wa:#0B6B5C;
  --r:20px;--tab:66px;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  --shadow:0 1px 2px rgba(18,26,39,.04),0 8px 24px -12px rgba(18,26,39,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"SFD",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;letter-spacing:-.006em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font:inherit;color:inherit}
.num,.n{font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:18px;height:18px}
svg.i.xs{width:14px;height:14px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:10px}

.side{display:none}
main{padding:calc(var(--safe-t) + 14px) 16px calc(var(--tab) + var(--safe-b) + 92px);max-width:640px;margin:0 auto}
.view{display:none}
.view.on{display:block}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.hello .g{font-size:15px;color:var(--ink2);font-weight:500}
.hello h1{font-size:30px;font-weight:700;letter-spacing:-.028em;line-height:1.1;margin-top:1px}
.avatar{width:42px;height:42px;border-radius:14px;background:var(--cobalt);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13.5px;letter-spacing:.02em;flex:none}
.pill{font-size:12px;font-weight:600;color:var(--ink2);background:var(--surface);padding:5px 10px;border-radius:20px;box-shadow:var(--shadow)}
h2{font-size:21px;font-weight:700;letter-spacing:-.02em;margin:30px 2px 12px;display:flex;justify-content:space-between;align-items:center}
h2 .more{font-size:15px;font-weight:600;color:var(--blue);letter-spacing:0}
h2 .cnt{font-size:14px;font-weight:600;color:var(--ink3);letter-spacing:0}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--cobalt);color:#fff;border-radius:26px;padding:20px 20px 18px;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(115deg,rgba(255,255,255,.07) 0 2px,transparent 2px 13px);-webkit-mask:linear-gradient(100deg,transparent 42%,#000 100%);mask:linear-gradient(100deg,transparent 42%,#000 100%)}
.hero .lab{font-size:14px;font-weight:500;color:rgba(255,255,255,.72);display:flex;align-items:center;gap:7px}
.hero .live{width:7px;height:7px;border-radius:50%;background:#6EE7A0;box-shadow:0 0 0 4px rgba(110,231,160,.18)}
.hero .big{font-size:46px;font-weight:700;letter-spacing:-.04em;line-height:1;margin-top:12px}
.hero .big small{font-size:22px;font-weight:600;letter-spacing:-.01em;color:rgba(255,255,255,.75);margin-left:3px}
.hero .cap{font-size:14.5px;color:rgba(255,255,255,.72);margin-top:6px}
.hero .spark{position:absolute;right:16px;top:20px;width:120px;height:52px}
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}
.hgrid>div{background:rgba(255,255,255,.09);border-radius:15px;padding:11px 12px}
.hgrid .v{font-size:22px;font-weight:700;letter-spacing:-.02em}
.hgrid .k{font-size:12.5px;color:rgba(255,255,255,.7);margin-top:2px}

/* quick actions */
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.qa .qi{width:58px;height:58px;border-radius:19px;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink);transition:transform .15s}
.qa button:active .qi{transform:scale(.93)}
.qa .qi.c{background:var(--blue);color:#fff}

/* cards + lists */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.list{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:13px;padding:14px 16px;width:100%;text-align:left;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:66px;right:0;height:1px;background:var(--line)}
.list.flat .row+.row::before{left:16px}
button.row:active{background:var(--fill)}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.ic svg{width:20px;height:20px}
.ic.red{background:var(--red-soft);color:var(--red)}.ic.amber{background:var(--amber-soft);color:var(--amber)}.ic.blue{background:var(--blue-soft);color:var(--blue)}.ic.green{background:var(--green-soft);color:var(--green)}
.mono{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;font-weight:700;font-size:13px;letter-spacing:.01em}
.grow{flex:1;min-width:0}
.t{font-weight:600;font-size:16px;letter-spacing:-.01em}
.d{color:var(--ink2);font-size:14px;margin-top:2px}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:#C3C9D2}
.end{text-align:right;flex:none}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:4px 9px;border-radius:8px;white-space:nowrap}
.badge.red{background:var(--red-soft);color:var(--red)}.badge.amber{background:var(--amber-soft);color:var(--amber)}.badge.green{background:var(--green-soft);color:var(--green)}.badge.grey{background:var(--fill);color:var(--ink2)}.badge.blue{background:var(--blue-soft);color:var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600;padding:8px 14px;border-radius:11px;background:var(--blue-soft);color:var(--blue);white-space:nowrap;transition:background .2s,color .2s,transform .1s}
.btn:active{transform:scale(.96)}
.btn.done{background:var(--green-soft);color:var(--green)}
.btn.solid{background:var(--blue);color:#fff;padding:14px 18px;border-radius:15px;font-size:16px;width:100%}
.btn.dark{background:var(--ink);color:#fff}
.btn.ghost{background:var(--fill);color:var(--ink)}

/* machines rings */
.rings{display:flex;gap:10px;overflow-x:auto;scroll-padding:0 16px;margin:0 -16px;padding:2px 16px 8px;scrollbar-width:none;scroll-snap-type:x mandatory}
.rings::-webkit-scrollbar{display:none}
.mc{flex:none;width:142px;padding:14px;scroll-snap-align:start}
.mc .ring{position:relative;width:62px;height:62px}
.mc .ring svg{width:62px;height:62px;transform:rotate(-90deg)}
.mc .ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:16px;font-weight:700;letter-spacing:-.02em}
.mc .nm{font-weight:600;font-size:14.5px;margin-top:12px;letter-spacing:-.01em}
.mc .jb{font-size:13px;color:var(--ink3);margin-top:2px}
.mc .st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;margin-top:9px}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}

/* stock */
.stock{padding:15px 16px}
.stock+.stock{border-top:1px solid var(--line)}
.sbar{height:8px;border-radius:4px;background:var(--fill);overflow:hidden;margin-top:9px;position:relative}
.sbar i{display:block;height:100%;border-radius:4px}

/* route */
.route{display:flex;gap:4px;margin-top:13px}
.route i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.route i.done{background:var(--ink)}
.route i.now{background:var(--blue)}
.route.risk i.now{background:var(--amber)}
.route.late i.now{background:var(--red)}
.rmeta{display:flex;justify-content:space-between;font-size:13.5px;color:var(--ink2);margin-top:8px}
.rmeta b{font-weight:600;color:var(--ink)}

/* jobs */
.stages{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:2px 16px 6px;scrollbar-width:none}
.stages::-webkit-scrollbar{display:none}
.stg{flex:none;min-width:104px;padding:12px 13px;text-align:left;border-radius:17px;background:var(--surface);box-shadow:var(--shadow);transition:background .2s,color .2s}
.stg .si{width:30px;height:30px;border-radius:10px;background:var(--fill);display:grid;place-items:center;color:var(--ink2)}
.stg .si svg{width:17px;height:17px}
.stg .v{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:10px;line-height:1}
.stg .k{font-size:13px;color:var(--ink2);font-weight:500;margin-top:3px}
.stg.on{background:var(--ink);color:#fff}
.stg.on .k{color:rgba(255,255,255,.7)}
.stg.on .si{background:rgba(255,255,255,.14);color:#fff}
.search{display:flex;align-items:center;gap:9px;background:var(--surface);box-shadow:var(--shadow);border-radius:14px;padding:11px 14px;color:var(--ink3);margin-bottom:12px}
.search input{border:0;background:none;outline:none;flex:1;font-size:16px;color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;padding:8px 14px;border-radius:20px;background:var(--surface);color:var(--ink2);white-space:nowrap;box-shadow:var(--shadow)}
.chip.on{background:var(--blue);color:#fff}
.chip b{font-weight:600;opacity:.6}
.jobs{display:grid;gap:10px}
.job{display:block;width:100%;text-align:left;padding:16px;transition:transform .12s}
.job:active{transform:scale(.985)}
.jtop{display:flex;align-items:center;gap:12px}
.jid{font-size:13px;color:var(--ink3);font-weight:500}

/* vendors */
.lot{padding:16px}
.lot+.lot{border-top:1px solid var(--line)}
.lhead{display:flex;gap:13px;align-items:center}
.tbar{position:relative;height:8px;border-radius:4px;background:var(--fill);margin-top:14px;overflow:visible}
.tbar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.tbar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);border-radius:1px}
.tmeta{display:flex;justify-content:space-between;font-size:13px;color:var(--ink3);margin-top:8px}
.lfoot{display:flex;justify-content:space-between;align-items:center;margin-top:13px;gap:10px}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sum3>div{padding:14px}
.sum3 .v{font-size:26px;font-weight:700;letter-spacing:-.025em;line-height:1;margin-top:10px}
.sum3 .k{font-size:13px;color:var(--ink2);font-weight:500;margin-top:4px}
.bar{height:7px;background:var(--fill);border-radius:4px;margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--blue)}

/* money */
.mhero{padding:20px;display:flex;gap:18px;align-items:center}
.donut{width:118px;height:118px;flex:none;position:relative}
.donut svg{width:118px;height:118px;transform:rotate(-90deg)}
.donut b{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:12px;color:var(--ink3);font-weight:500;line-height:1.25}
.donut b span{display:block;font-size:19px;color:var(--ink);font-weight:700;letter-spacing:-.02em}
.mhero .big{font-size:34px;font-weight:700;letter-spacing:-.035em;line-height:1}
.mhero .big small{font-size:18px;color:var(--ink2);font-weight:600;letter-spacing:0;margin-left:2px}
.leg{display:grid;gap:7px;margin-top:12px;font-size:13.5px;color:var(--ink2)}
.leg div{display:flex;align-items:center;gap:8px}
.leg i{width:9px;height:9px;border-radius:3px}
.leg b{margin-left:auto;color:var(--ink);font-weight:600}
.chart{padding:18px 16px 14px}
.chart svg{width:100%;height:auto;display:block}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(12,18,30,.38);opacity:0;transition:opacity .25s;backdrop-filter:blur(2px)}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:26px 26px 0 0;max-height:92vh;display:flex;flex-direction:column;transform:translateY(100%);visibility:hidden;transition:transform .36s cubic-bezier(.2,.8,.2,1),visibility 0s .36s}
.sheet-wrap.open{pointer-events:auto}
.sheet-wrap.open .scrim{opacity:1}
.sheet-wrap.open .sheet{transform:none;visibility:visible;transition:transform .36s cubic-bezier(.2,.8,.2,1)}
.grab{width:38px;height:5px;border-radius:3px;background:#C5CBD4;margin:8px auto 0;flex:none}
.sh{display:flex;align-items:center;justify-content:space-between;padding:10px 18px 8px;flex:none}
.sh h3{font-size:20px;font-weight:700;letter-spacing:-.02em}
.close{width:34px;height:34px;border-radius:50%;background:#DFE3EA;display:grid;place-items:center;color:var(--ink2)}
.close svg{width:16px;height:16px}
.sb{overflow-y:auto;padding:6px 16px calc(24px + var(--safe-b));-webkit-overflow-scrolling:touch}

.kv{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:18px;overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow)}
.kv div{background:var(--surface);padding:12px 15px}
.kv span{display:block;font-size:13px;color:var(--ink3)}
.kv b{font-weight:600;font-size:15.5px}
.tl{padding:6px 18px}
.step{display:flex;gap:14px;padding:11px 0;position:relative;align-items:center}
.step .n{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;background:var(--surface);position:relative;z-index:1;color:#fff}
.step .n svg{width:12px;height:12px;stroke-width:3}
.step:not(:last-child)::after{content:"";position:absolute;left:11px;top:35px;bottom:-11px;width:2px;background:var(--line)}
.step.done .n{background:var(--ink);border-color:var(--ink)}
.step.done:not(:last-child)::after{background:var(--ink)}
.step.now .n{border-color:var(--blue);background:var(--blue-soft)}
.step.now.risk .n{border-color:var(--amber);background:var(--amber-soft)}
.step.now.late .n{border-color:var(--red);background:var(--red-soft)}
.step:not(.done):not(.now) .t{color:var(--ink3);font-weight:500}

/* certificate */
.cert{background:#fff;border-radius:8px;padding:22px 20px;box-shadow:0 1px 0 var(--line),0 16px 40px -20px rgba(20,30,40,.4);font-size:13.5px}
.cert .ch{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:14px;gap:12px}
.cert .cn{font-size:17px;font-weight:700}
.cert .ca{color:var(--ink2);font-size:12px;margin-top:3px;line-height:1.45}
.cert h4{font-size:15px;font-weight:700;margin-bottom:2px}
.cert table{width:100%;border-collapse:collapse;margin:14px 0}
.cert th{text-align:left;font-weight:500;color:var(--ink3);font-size:12px;padding:0 0 6px;border-bottom:1px solid var(--line)}
.cert td{padding:8px 0;border-bottom:1px solid var(--line)}
.cert td:not(:first-child),.cert th:not(:first-child){text-align:right}
.cert .ok{color:var(--green);font-weight:700}
.cert .foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:18px;color:var(--ink2);font-size:12px}
.stamp{border:2px solid var(--green);color:var(--green);font-weight:700;border-radius:8px;padding:5px 10px;font-size:13px;transform:rotate(-4deg)}

/* whatsapp */
.wa{border-radius:20px;overflow:hidden;background:#EAE3D8;box-shadow:var(--shadow)}
.wah{background:var(--wa);color:#fff;display:flex;align-items:center;gap:10px;padding:12px 14px}
.wah .av{width:36px;height:36px;border-radius:50%;background:#fff;color:var(--wa);display:grid;place-items:center;font-weight:700;font-size:12.5px}
.wah b{font-weight:600;font-size:15.5px;display:block}
.wah small{font-size:12.5px;opacity:.8}
.wab{padding:14px 12px 10px;display:flex;flex-direction:column;gap:8px;min-height:240px}
.msg{background:#fff;border-radius:12px 12px 12px 4px;padding:9px 12px 6px;max-width:88%;font-size:15px;line-height:1.5;white-space:pre-line;align-self:flex-start;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.msg.me{background:#D8F8C9;border-radius:12px 12px 4px 12px;align-self:flex-end}
.msg time{display:block;text-align:right;font-size:11px;color:#8A9399;margin-top:2px}
.qr{display:flex;flex-wrap:wrap;gap:7px;padding:2px 12px 14px}
.qr button{background:#fff;color:var(--wa);font-weight:600;font-size:14px;padding:8px 13px;border-radius:18px;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.typing{display:flex;gap:4px;padding:12px 14px}
.typing i{width:7px;height:7px;border-radius:50%;background:#9AA3A8;animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3}30%{opacity:1}}
.wacard{display:flex;align-items:center;gap:14px;background:var(--wa);color:#fff;border-radius:var(--r);padding:16px;width:100%;text-align:left;margin-top:12px;position:relative;overflow:hidden}
.wacard .ic{background:rgba(255,255,255,.16);color:#fff}
.wacard .d{color:rgba(255,255,255,.78)}

/* ask */
.askbox{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:18px;padding:8px 8px 8px 16px;box-shadow:var(--shadow)}
.askbox input{flex:1;border:0;outline:none;background:none;font-size:16px;min-width:0}
.askbox button{width:40px;height:40px;border-radius:13px;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
.sugs{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.sugs button{font-size:14px;font-weight:600;padding:9px 13px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);color:var(--ink)}
.thread{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.q{align-self:flex-end;background:var(--blue);color:#fff;padding:10px 14px;border-radius:18px 18px 5px 18px;font-weight:500;max-width:85%}
.a{align-self:flex-start;width:100%;padding:14px 16px;border-radius:5px 20px 20px 20px}
.a .ah{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--blue);margin-bottom:8px}
.a .lead{font-size:16px;font-weight:600;letter-spacing:-.01em;margin-bottom:6px}
.a .ar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.a .ar:first-of-type{border-top:0}
.fab{position:fixed;right:16px;bottom:calc(var(--tab) + var(--safe-b) + 14px);z-index:30;display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;font-weight:600;font-size:15px;padding:13px 18px 13px 15px;border-radius:30px;box-shadow:0 12px 28px -10px rgba(18,26,39,.55)}
.fab:active{transform:scale(.96)}

/* quote */
.drop{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:28px 18px;border:2px dashed #CBD2DC;border-radius:20px;background:var(--surface);cursor:pointer}
.drop .ic{width:52px;height:52px;border-radius:16px}
.drop .ic svg{width:26px;height:26px}
.drawing{background:#F7F9FC;border-radius:16px;border:1px solid var(--line);padding:10px}
.drawing svg{width:100%;height:auto;display:block}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:15px;color:var(--ink3);transition:color .2s}
.chk .cc{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:#fff}
.chk .cc svg{width:12px;height:12px;stroke-width:3}
.chk.ok{color:var(--ink)}
.chk.ok .cc{background:var(--green);border-color:var(--green)}
.chk.run .cc{border-color:var(--blue);border-right-color:transparent;animation:r .7s linear infinite}
.spec{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:16px;overflow:hidden}
.spec div{background:var(--surface);padding:10px 14px}
.spec span{display:block;font-size:12.5px;color:var(--ink3)}
.spec b{font-weight:600;font-size:15px}
.cost .ar{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.cost .ar:first-child{border-top:0}
.cost .ar span:last-child{font-weight:600}
.cost .tot{display:flex;justify-content:space-between;align-items:baseline;padding-top:14px;margin-top:4px;border-top:2px solid var(--ink)}
.cost .tot b{font-size:28px;letter-spacing:-.03em}

/* scan */
.vf{position:relative;aspect-ratio:1/1;max-width:340px;margin:4px auto 0;border-radius:26px;background:#0F1726;overflow:hidden;display:grid;place-items:center}
.vf .cn{position:absolute;width:44px;height:44px;border:4px solid #fff;border-radius:6px}
.vf .c1{top:24px;left:24px;border-right:0;border-bottom:0}.vf .c2{top:24px;right:24px;border-left:0;border-bottom:0}.vf .c3{bottom:24px;left:24px;border-right:0;border-top:0}.vf .c4{bottom:24px;right:24px;border-left:0;border-top:0}
.vf .line{position:absolute;left:30px;right:30px;height:2px;background:#6EE7A0;box-shadow:0 0 18px 3px rgba(110,231,160,.55);animation:scan 1.4s ease-in-out infinite}
@keyframes scan{0%{top:32%}50%{top:68%}100%{top:32%}}
.jc{background:#fff;border-radius:14px;padding:14px 16px;width:62%;transform:rotate(-3deg);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.jc .qrc{width:64px;height:64px;margin-bottom:8px}

.mini{display:none;width:100%;text-align:left;padding:16px 18px;margin-top:12px}
.msplit{display:flex;gap:3px;height:8px;margin-top:12px}.msplit i{border-radius:4px;display:block}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(246,248,251,.86);backdrop-filter:saturate(1.8) blur(22px);-webkit-backdrop-filter:saturate(1.8) blur(22px);border-top:1px solid rgba(0,0,0,.06);display:flex;padding:7px 6px calc(7px + var(--safe-b))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:3px 0;color:var(--ink3);font-size:11px;font-weight:600;position:relative}
.tab.on{color:var(--blue)}
.pip{position:absolute;top:0;left:calc(50% + 8px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid #F6F8FB}

.toast{position:fixed;left:50%;bottom:calc(var(--tab) + var(--safe-b) + 20px);transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 17px;border-radius:15px;font-size:14.5px;font-weight:500;display:flex;gap:9px;align-items:center;opacity:0;transition:all .25s;z-index:60;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg{color:#6EE7A0;width:18px;height:18px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:r .7s linear infinite;display:inline-block}
@keyframes r{to{transform:rotate(360deg)}}
.empty{padding:30px;text-align:center;color:var(--ink3)}
.red-t{color:var(--red)}.amb-t{color:var(--amber)}.grn-t{color:var(--green)}.mut{color:var(--ink3)}
.mt{margin-top:12px}
.rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* desktop */
@media (min-width:980px){
  .tabbar{display:none}
  .side{display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;width:248px;padding:24px 14px;background:var(--surface);border-right:1px solid var(--line)}

  .nav:hover{background:var(--fill)}
  .nav.on{background:var(--blue-soft);color:var(--blue)}

  .side .by{margin-top:auto;padding:0 10px;font-size:12.5px;color:var(--ink3);display:grid;gap:10px;justify-items:start}
  main{margin-left:248px;max-width:none;padding:30px 44px 80px}
  .view{max-width:1120px}
  .top .pill{display:none}
  .dgrid{display:grid;grid-template-columns:1.35fr 1fr;gap:22px;align-items:start}
  .dgrid h2:first-child{margin-top:0}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:0 22px;align-items:start}
  .rings{display:grid;grid-template-columns:repeat(3,1fr);margin:0;padding:0;overflow:visible}
  .mc{width:auto}
  .jobs{grid-template-columns:1fr 1fr}
  .stages{margin:0 0 14px;padding:2px 0 6px;display:grid;grid-template-columns:repeat(5,1fr)}
  .chips{margin:0 0 14px;padding:0}
  .fab{bottom:28px;right:32px}

  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:580px;max-height:88vh;border-radius:26px;transform:translate(-50%,-46%) scale(.98);opacity:0;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .2s,visibility 0s .3s}

  .grab{display:none}
  .sh{padding-top:18px}

  .mini{display:block}
  .brand b{color:var(--ink)}
  .hero .big{font-size:56px}

}

const ring=(p,c,size=62,sw=6)=>{const r=(size-sw)/2,C=2*Math.PI*r;return `<svg viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--fill)" stroke-width="${sw}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${C*p/100} ${C}"/></svg>`};
const spark=(a,w,h)=>{const mx=Math.max(...a),pts=a.map((v,i)=>[i/(a.length-1)*w,h-4-(v/mx)*(h-10)]);const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');const l=pts[pts.length-1];return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d} L${w} ${h} L0 ${h}Z" fill="rgba(255,255,255,.08)"/><path d="${d}" fill="none" stroke="#9FB2FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${l[0]-2}" cy="${l[1]}" r="4" fill="#fff"/></svg>`};
const route=j=>`<div class="route ${j.st}">${STAGES.map((s,i)=>`<i class="${i<j.stage?'done':i===j.stage?'now':''}"></i>`).join('')}</div>`;

 'Who owes us?':INV.filter(i=>i.d>30).map(i=>`${i.d>45?'🔴':'🟡'} ${i.c}: ${L(i.a)}, ${i.d} days`).join('\n')+`\n\nReply *remind* to send all 4 reminders.`,
 'Free machines':`⚪ Matrix spline grinder, free from 2 pm\n⚪ CNC wire cut, no job loaded\n\nJ-2625 worm wheel can start once bronze arrives.`,
 'remind':`Done ✅ Reminders sent to Nichrome, Force Motors, Kirloskar and Bharat Forge.`
};
function waSheet(){
  openSheet('WhatsApp report',`<div class="wa"><div class="wah"><span class="av">IMT</span><span><b>IMT Assistant</b><small>Business account</small></span></div>
   <div class="wab" id="wab"><div class="msg">${WA_MAIN.replace(/\*(.+?)\*/g,'<b>$1</b>')}<time>8:00 pm</time></div></div>
   <div class="qr" id="qr">${['Late jobs','Who owes us?','Free machines'].map(k=>`<button data-q="${k}">${k}</button>`).join('')}</div></div>`);
}
function waAsk(k){
  const b=$('#wab'); if(!b) return;
  const tm='8:0'+(1+b.children.length%8)+' pm';
  b.insertAdjacentHTML('beforeend',`<div class="msg me">${k}<time>${tm}</time></div><div class="msg typing" id="typ"><i></i><i></i><i></i></div>`);
  b.lastElementChild.scrollIntoView({block:'end',behavior:'smooth'});
  later(()=>{const ty=$('#typ');if(!ty)return;ty.outerHTML=`<div class="msg">${WA_Q[k].replace(/\*(.+?)\*/g,'<b>$1</b>')}<time>${tm}</time></div>`;
    if(k==='Who owes us?'&&!$('#qr [data-q="remind"]'))$('#qr').insertAdjacentHTML('afterbegin','<button data-q="remind">remind</button>');
    if(k==='remind')INV.filter(i=>i.d>30).forEach(i=>paid.add(i.id));
    b.lastElementChild.scrollIntoView({block:'end',behavior:'smooth'})},850);
}

/* Ask IMT */
const ASK=[
 {k:/late|delay|behind|slow/i,q:"What's late?",a:()=>`<div class="lead">${lateJ().length} job late, ${riskJ().length} at risk</div>${[...lateJ(),...riskJ()].map(j=>`<div class="ar"><span>${j.client.split(' ')[0]} ${j.part.toLowerCase()}</span><span class="badge ${tone(j.st)}">${j.late}</span></div>`).join('')}`},
 {k:/owe|payment|pay|receiv|collect|due money/i,q:'Who owes us money?',a:()=>`<div class="lead">${L(b2+b3)} is overdue from 4 clients</div>${INV.filter(i=>i.d>30).map(i=>`<div class="ar"><span>${i.c}</span><span class="num"><b>${L(i.a)}</b> <span class="badge ${i.d>45?'red':'amber'}">${i.d} days</span></span></div>`).join('')}<button class="btn mt" data-payall>${ic('send','i s')}Remind all 4</button>`},
 {k:/machine|free|idle|grinder|capacity/i,q:'Which machine is free?',a:()=>`<div class="lead">2 machines are free today</div><div class="ar"><span>Matrix spline grinder</span><span class="badge grey">Free from 2 pm</span></div><div class="ar"><span>CNC wire cut</span><span class="badge grey">No job</span></div><div class="ar"><span>Stanko external grinder</span><span class="badge red">96% booked</span></div>`},
 {k:/sale|revenue|month|october|turnover/i,q:'How were sales last month?',a:()=>`<div class="lead">October sales were ₹51.6 L, up 9% on September</div><div class="ar"><span>Purchases</span><b class="num">₹28.4 L</b></div><div class="ar"><span>Gross margin</span><b class="num grn-t">₹23.2 L</b></div><div class="ar"><span>Biggest client</span><b>Bharat Forge</b></div>`},
 {k:/stock|material|reorder|steel|ball/i,q:'What should I reorder?',a:()=>`<div class="lead">2 items are below what open jobs need</div>${STOCK.filter(s=>s.have<s.need).map(s=>`<div class="ar"><span>${s.n}</span><span class="num">${s.have.toLocaleString('en-IN')} of ${s.need.toLocaleString('en-IN')} ${s.u}</span></div>`).join('')}<button class="btn mt" data-reorder>${ic('send','i s')}Send purchase orders</button>`},
 {k:/vendor|heat|harden|nitrid/i,q:'Which vendors are late?',a:()=>`<div class="lead">2 vendor lots are overdue</div>${vLate.map(v=>`<div class="ar"><span>${v.n}</span><span class="badge red">${v.tag}</span></div>`).join('')}`}
];
function askSheet(pre){
  openSheet('Ask IMT',`<form class="askbox" id="askf"><input id="askq" placeholder="Ask about jobs, money, machines…" autocomplete="off" aria-label="Ask a question"><button type="submit" aria-label="Ask">${ic('arrowup','i s')}</button></form>
   <div class="sugs">${ASK.map(a=>`<button data-sug="${a.q}">${a.q}</button>`).join('')}</div><div class="thread" id="thread"></div>`);
  $('#askf').addEventListener('submit',e=>{e.preventDefault();const v=$('#askq').value.trim();if(v){answer(v);$('#askq').value=''}});
  if(pre) answer(pre);
}
function answer(q){
  const th=$('#thread');if(!th)return;
  const hit=ASK.find(a=>a.k.test(q));
  th.insertAdjacentHTML('beforeend',`<div class="q rise">${q.replace(/</g,'&lt;')}</div><div class="card a rise" id="pend"><div class="ah">${ic('ask','i xs')}IMT</div><div class="typing" style="padding:4px 0"><i></i><i></i><i></i></div></div>`);
  $('#pend').scrollIntoView({block:'end',behavior:'smooth'});
  later(()=>{const p=$('#pend');if(!p)return;p.removeAttribute('id');p.innerHTML=`<div class="ah">${ic('ask','i xs')}IMT</div>`+(hit?hit.a():`<div class="lead">I can answer questions on jobs, payments, machines, stock and vendors.</div><div class="d">Try one of the questions above.</div>`);p.scrollIntoView({block:'end',behavior:'smooth'})},900);
}

/* Quote builder */
const DRAW=`<svg viewBox="0 0 340 150" font-family="inherit" aria-label="Sample drawing of a ball screw">
 <g stroke="#2A3A55" stroke-width="1.2" fill="none">
  <rect x="20" y="62" width="34" height="26"/><rect x="54" y="58" width="22" height="34"/>
  <rect x="76" y="56" width="200" height="38"/>
  ${Array.from({length:25},(_,i)=>`<line x1="${80+i*8}" y1="56" x2="${86+i*8}" y2="94"/>`).join('')}
  <rect x="276" y="62" width="26" height="26"/><rect x="302" y="66" width="20" height="18"/>
  <path d="M20 40h302M20 36v8M322 36v8" stroke="#2A4FE0"/><path d="M76 112h200M76 108v8M276 108v8" stroke="#2A4FE0"/>
  <path d="M290 56v-10M290 94v10" stroke="#2A4FE0" stroke-dasharray="2 2"/>
 </g>
 <g font-size="10" fill="#2A4FE0" text-anchor="middle" font-weight="600"><text x="171" y="33">1500</text><text x="176" y="126">Thread 1250, lead 10</text><text x="306" y="52">Ø32</text></g>
 <g font-size="9" fill="#5B6676"><text x="20" y="142">42CrMo4, 58–62 HRC, C5 ground</text><text x="322" y="142" text-anchor="end">RFQ FM/2611, qty 4</text></g>
</svg>`;
const QSPEC=[['Part','Ball screw'],['Client','Force Motors'],['Nominal Ø','32 mm'],['Length','1500 mm'],['Lead','10 mm'],['Accuracy','C5 ground'],['Material','42CrMo4'],['Quantity','4 pcs']];
const QCOST=[['Material, 18 kg bar',2610],['Turning, 2.5 h',2250],['Induction hardening',1400],['Thread grinding, 6 h',10800],['Ball nut and balls',6500],['Inspection and test rig',1200]];
function quoteSheet(){
  openSheet('New quote',`<div id="qz">
   <label class="drop"><input type="file" id="qfile" accept="image/*,.pdf,.dxf,.dwg" hidden><span class="ic blue">${ic('upload')}</span><span class="t">Upload customer drawing</span><span class="d" style="margin:0">PDF, photo or CAD file</span></label>
   <button class="btn ghost mt" style="width:100%;padding:13px;border-radius:15px" data-sample>${ic('doc','i s')}Use sample RFQ from Force Motors</button></div>`);
  $('#qfile').addEventListener('change',e=>{if(e.target.files.length)runQuote(e.target.files[0].name)});
}
function runQuote(name){
  const steps=['Reading dimensions','Finding material and hardness','Checking grinder capacity','Pricing from past jobs'];
  $('#qz').innerHTML=`<div class="drawing">${DRAW}</div><div class="d mt" style="text-align:center">${name}</div><div class="card mt" style="padding:8px 16px" id="qsteps">${steps.map(s=>`<div class="chk"><span class="cc"></span>${s}</div>`).join('')}</div>`;
  const els=[...document.querySelectorAll('#qsteps .chk')];
  els.forEach((el,i)=>{later(()=>{el.classList.add('run')},i*550);later(()=>{el.classList.remove('run');el.classList.add('ok');el.querySelector('.cc').innerHTML=ic('check')},i*550+500)});
  later(showQuote,steps.length*550+250);
}
function showQuote(){
  const sub=QCOST.reduce((s,c)=>s+c[1],0), mg=Math.round(sub*.22), pc=Math.round((sub+mg)/100)*100, tot=pc*4;
  $('#qz').innerHTML=`<div class="drawing rise">${DRAW}</div>
   <h2 style="margin-top:20px">Read from drawing <span class="badge green">${ic('check','i xs')}8 of 8</span></h2>
   <div class="spec rise">${QSPEC.map(s=>`<div><span>${s[0]}</span><b>${s[1]}</b></div>`).join('')}</div>
   <h2>Cost per piece</h2>
   <div class="card cost rise" style="padding:8px 16px 16px">${QCOST.map(c=>`<div class="ar"><span>${c[0]}</span><span class="num">${INR(c[1])}</span></div>`).join('')}<div class="ar"><span>Margin 22%</span><span class="num">${INR(mg)}</span></div>
    <div class="tot"><span><div class="d" style="margin:0">4 pcs at ${INR(pc)}</div><b class="num">${INR(tot)}</b></span><span class="badge blue">${ic('clock','i xs')}18 days</span></div></div>
   <button class="btn solid mt" data-sendquote>${ic('send','i s')}Send quote to Force Motors</button>`;
}

/* Scan */
function scanSheet(){
  const j=JOBS.find(x=>x.id==='J-2598');
  openSheet('Scan job card',`<div class="vf"><span class="cn c1"></span><span class="cn c2"></span><span class="cn c3"></span><span class="cn c4"></span>
   <div class="jc"><svg class="qrc" viewBox="0 0 7 7" shape-rendering="crispEdges"><path fill="#121A27" d="M0 0h3v3H0zM4 0h3v3H4zM0 4h3v3H0zM4 4h1v1H4zM6 4h1v1H6zM5 5h1v1H5zM4 6h1v1H4zM6 6h1v1H6z"/><path fill="#fff" d="M1 1h1v1H1zM5 1h1v1H5zM1 5h1v1H1z"/></svg><div style="font-weight:700;font-size:15px">${j.id}</div><div style="font-size:12px;color:var(--ink2)">${j.client}</div></div>
   <span class="line"></span></div><div id="scanres" class="d" style="text-align:center;margin-top:16px">Point at the QR code on the job card</div>`);
  later(()=>{const r=$('#scanres');if(!r)return;const v=document.querySelector('.vf .line');if(v)v.remove();
   r.outerHTML=`<div class="card rise" style="padding:16px;margin-top:16px"><div style="display:flex;gap:13px;align-items:center">${mono(j.client)}<span class="grow"><div class="t">${j.part} × ${j.qty}</div><div class="d num">${j.id}, ${j.client}</div></span><span class="badge ${tone(j.st)}">${j.late}</span></div>${route(j)}<div class="rmeta"><span>Now <b>${STAGES[j.stage]}</b></span></div>
   ${j.stage<4?`<button class="btn solid mt" data-advance="${j.id}">${ic('check','i s')}Passed. Move to ${STAGES[j.stage+1]}</button>`:''}</div>`},1700);
}

/* ---------- toast ---------- */
let tT;
function toast(m){const t=$('#toast');t.innerHTML=ic('check')+'<span>'+m+'</span>';t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),2400)}

/* ---------- nav ---------- */
const TABS=[['today','Home','today'],['jobs','Jobs','jobs'],['vendors','Vendors','vendors'],['money','Money','money'],['quality','Quality','quality']];
const pip=k=>k==='jobs'?lateJ().length+riskJ().length:k==='vendors'?vLate.length-sent.size:k==='quality'?pq().length:0;
let cur='today';
function countUp(){
  if(counted||matchMedia('(prefers-reduced-motion:reduce)').matches)return;counted=true;
  document.querySelectorAll('[data-count]').forEach(el=>{const to=+el.dataset.count,dec=+(el.dataset.dec||0),pre=el.dataset.pre||'';const t0=performance.now();
   const f=t=>{const p=Math.min(1,(t-t0)/900),e=1-Math.pow(1-p,3);el.textContent=pre+(to*e).toFixed(dec);if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)});
}
function render(){
  $('#main').innerHTML=TABS.map(([k])=>`<section class="view ${k===cur?'on':''}" id="v-${k}">${k===cur?V[k]():''}</section>`).join('');
  $('#tabbar').innerHTML=TABS.map(([k,n,i])=>`<button class="tab ${k===cur?'on':''}" data-go="${k}" aria-label="${n}">${ic(i)}${n}${pip(k)>0?`<span class="pip num">${pip(k)}</span>`:''}</button>`).join('');
  $('#sidenav').innerHTML=TABS.map(([k,n,i])=>`<button class="nav ${k===cur?'on':''}" data-go="${k}">${ic(i)}${n}${pip(k)>0?`<span class="np num">${pip(k)}</span>`:''}</button>`).join('');
  if(cur==='jobs'){drawJobs();$('#jq').addEventListener('input',e=>{jq=e.target.value;drawJobs()})}
  if(cur==='today')countUp();
}
function go(k){if(!V[k])k='today';cur=k;render();window.scrollTo({top:0});try{if(location.hash!=='#'+k)history.replaceState(null,'','#'+k)}catch(e){}}
window.addEventListener('hashchange',()=>{const k=location.hash.slice(1);if(V[k]&&k!==cur)go(k)});

function advance(id){
  const j=JOBS.find(x=>x.id===id); if(!j||j.stage>=4)return;
  j.stage++; j.hist[j.stage]='14 Nov';
  if(j.stage===4){j.st='ok';j.late='Ready to ship';j.mc='Packing'}
  else if(j.stage===3){j.mc='Trimos CMM'}
  toast(`${j.id} moved to ${STAGES[j.stage]}`); render(); jobSheet(id);
}
document.addEventListener('click',e=>{
  const el=e.target.closest('button,[data-close]'); if(!el) return;
  const d=el.dataset;
  if('close' in d){closeSheet();return}
  if(d.go){closeSheet();go(d.go);return}
  if(d.job){jobSheet(d.job);return}
  if(d.f){jf=d.f;document.querySelectorAll('#chips .chip').forEach(c=>c.classList.toggle('on',c.dataset.f===jf));drawJobs();return}
  if(d.stage){const s=+d.stage;js=js===s?-1:s;document.querySelectorAll('#pipe .stg').forEach(c=>c.classList.toggle('on',+c.dataset.stage===js));drawJobs();return}
  if(d.remind){const v=VENDORS.find(x=>x.id===d.remind);sent.add(v.id);el.classList.add('done');el.innerHTML=ic('check','i s')+'Reminded';toast(`WhatsApp reminder sent to ${v.n}`);render();return}
  if(d.recv){const v=VENDORS.find(x=>x.id===d.recv);recv.add(v.id);el.classList.remove('dark');el.classList.add('done');el.innerHTML=ic('check','i s')+'Received';toast(`${v.item} received from ${v.n}`);return}
  if(d.pay){paid.add(d.pay);el.classList.add('done');el.textContent='Reminded';const i=INV.find(x=>x.id===d.pay);toast(`Payment reminder sent to ${i.c}`);return}
  if('payall' in d){INV.filter(i=>i.d>30).forEach(i=>paid.add(i.id));toast('Reminders sent to 4 clients');el.classList.add('done');el.innerHTML=ic('check','i s')+'Sent';if(cur==='money'&&!$('#sheet').classList.contains('open'))render();return}
  if('reorder' in d){toast('Purchase orders sent for EN-31 bar and steel balls');return}
  if(d.gen){genCert(d.gen,el);return}
  if(d.cert){openSheet('Certificate',certHTML(d.cert));return}
  if(d.sendcert){toast(`Certificate emailed to ${d.sendcert}`);return}
  if(d.update){const j=JOBS.find(x=>x.id===d.update);toast(`Status sent to ${j.client} on WhatsApp`);return}
  if(d.advance){advance(d.advance);return}
  if(d.ship){const j=JOBS.find(x=>x.id===d.ship);toast(`Dispatch note sent to ${j.client}`);closeSheet();return}
  if('wa' in d){waSheet();return}
  if(d.q){el.remove();waAsk(d.q);return}
  if('ask' in d){askSheet();return}
  if(d.sug){answer(d.sug);return}
  if('quote' in d){quoteSheet();return}
  if('sample' in d){runQuote('RFQ_ForceMotors_BS32x1500.pdf');return}
  if('sendquote' in d){toast('Quote sent to Force Motors');closeSheet();return}
  if('scan' in d){scanSheet();return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
$('.close').innerHTML=ic('x');
$('.fab').innerHTML=ic('ask','i s')+'Ask IMT';
go((location.hash||'').slice(1)||'today');
</script>
</body>
</html>
