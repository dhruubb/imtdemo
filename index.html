:root{
  --bg:#F1F2F4;--surface:#FFFFFF;--ink:#16202A;--ink2:#56616C;--ink3:#8D96A0;--line:#E4E7EB;--fill:#F5F6F8;
  --blue:#1E44C8;--blue-soft:#E9EEFC;
  --red:#C4372C;--red-soft:#FCEBE9;
  --amber:#A86F00;--amber-soft:#FBF1DA;
  --green:#28834B;--green-soft:#E4F3EA;
  --r:16px;--tab:64px;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:"SFD",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
input{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:18px;height:18px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}

/* layout */
.app{min-height:100vh}
.side{display:none}
main{padding:calc(var(--safe-t) + 12px) 16px calc(var(--tab) + var(--safe-b) + 28px);max-width:640px;margin:0 auto}
.view{display:none}
.view.on{display:block;animation:in .28s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.top{display:flex;align-items:center;justify-content:space-between;height:36px;margin-bottom:6px}
.co{font-size:15px;font-weight:600;color:var(--ink2)}
.demo{font-size:12px;font-weight:500;color:var(--ink2);background:var(--surface);border:1px solid var(--line);padding:4px 10px;border-radius:20px}
h1{font-size:34px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.sub{color:var(--ink2);font-size:15px;margin-top:4px}
.head{margin:4px 0 22px}
h2{font-size:20px;font-weight:700;letter-spacing:-.015em;margin:28px 4px 10px;display:flex;justify-content:space-between;align-items:baseline}
h2 small{font-size:14px;font-weight:500;color:var(--ink3);letter-spacing:0}

/* grouped list */
.group{background:var(--surface);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;position:relative;width:100%;text-align:left}
.row+.row::before{content:"";position:absolute;top:0;left:54px;right:0;height:1px;background:var(--line)}
.group.flat .row+.row::before{left:14px}
button.row:active{background:var(--fill)}
.ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none}
.ic svg{width:18px;height:18px}
.ic.red{background:var(--red-soft);color:var(--red)}
.ic.amber{background:var(--amber-soft);color:var(--amber)}
.ic.blue{background:var(--blue-soft);color:var(--blue)}
.ic.green{background:var(--green-soft);color:var(--green)}
.grow{flex:1;min-width:0}
.t{font-weight:500;font-size:16px}
.d{color:var(--ink2);font-size:14px;margin-top:1px}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:#C3C9CF}
.end{text-align:right;flex:none}
.end .t{font-weight:600}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;padding:3px 8px;border-radius:7px;white-space:nowrap}
.badge.red{background:var(--red-soft);color:var(--red)}
.badge.amber{background:var(--amber-soft);color:var(--amber)}
.badge.green{background:var(--green-soft);color:var(--green)}
.badge.grey{background:var(--fill);color:var(--ink2)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:600;padding:8px 13px;border-radius:10px;background:var(--blue-soft);color:var(--blue);white-space:nowrap;transition:background .15s,color .15s}
.btn:active{transform:scale(.97)}
.btn.done{background:var(--green-soft);color:var(--green)}
.btn.solid{background:var(--blue);color:#fff;padding:13px 18px;border-radius:13px;font-size:16px;width:100%}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border-radius:var(--r);padding:14px 15px 15px;text-align:left}
.stat .k{display:flex;align-items:center;gap:7px;color:var(--ink2);font-size:14px;font-weight:500}
.stat .k svg{width:17px;height:17px}
.stat .v{font-size:30px;font-weight:700;letter-spacing:-.03em;margin-top:8px;line-height:1}
.stat .v span{font-size:17px;font-weight:600;letter-spacing:0;color:var(--ink2);margin-left:2px}
.stat .f{font-size:13px;color:var(--ink3);margin-top:6px}
.stat.red .f{color:var(--red)}

/* machines */
.load{height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:8px}
.load i{display:block;height:100%;background:var(--ink);border-radius:3px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.run{background:var(--green)}.dot.idle{background:var(--ink3)}.dot.setup{background:var(--amber)}

/* route: the job's path through the shop */
.route{display:flex;gap:3px;margin-top:11px}
.route i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.route i.done{background:var(--ink)}
.route i.now{background:var(--blue)}
.route.risk i.now{background:var(--amber)}
.route.late i.now{background:var(--red)}
.rmeta{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-top:7px}
.rmeta b{font-weight:600;color:var(--ink)}
.job{display:block;padding:14px 15px 13px}
.job+.job{border-top:1px solid var(--line)}
.jtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.jid{font-size:13px;color:var(--ink3);font-weight:500}

/* jobs toolbar */
.search{display:flex;align-items:center;gap:8px;background:#E6E8EC;border-radius:12px;padding:9px 12px;color:var(--ink3);margin-bottom:12px}
.search input{border:0;background:none;outline:none;flex:1;font-size:16px;color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{font-size:14px;font-weight:500;padding:7px 13px;border-radius:20px;background:var(--surface);color:var(--ink2);white-space:nowrap;border:1px solid var(--line)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip b{font-weight:600;margin-left:3px;opacity:.6}

/* money */
.hero{background:var(--surface);border-radius:var(--r);padding:18px 16px 16px}
.hero .big{font-size:40px;font-weight:700;letter-spacing:-.035em;line-height:1}
.hero .big span{font-size:22px;color:var(--ink2);font-weight:600;letter-spacing:-.01em}
.split{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin:16px 0 12px}
.split i{display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;color:var(--ink2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px;display:block}
.legend b{color:var(--ink);font-weight:600}
.chart{background:var(--surface);border-radius:var(--r);padding:16px 14px 12px}
.chart svg{width:100%;height:auto;display:block}
.bar{height:6px;background:var(--fill);border-radius:3px;margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:3px}

/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(15,22,30,.32);opacity:0;transition:opacity .25s}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:20px 20px 0 0;max-height:90vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .34s cubic-bezier(.2,.8,.2,1)}
.sheet{visibility:hidden}
.sheet-wrap.open{pointer-events:auto}
.sheet-wrap.open .sheet{visibility:visible}
.sheet-wrap.open .scrim{opacity:1}
.sheet-wrap.open .sheet{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:#C9CED4;margin:8px auto 0;flex:none}
.sh{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 6px;flex:none}
.sh h3{font-size:19px;font-weight:700;letter-spacing:-.015em}
.close{width:32px;height:32px;border-radius:50%;background:#E3E6EA;display:grid;place-items:center;color:var(--ink2)}
.close svg{width:16px;height:16px}
.sb{overflow-y:auto;padding:6px 16px calc(24px + var(--safe-b));-webkit-overflow-scrolling:touch}

/* timeline in job sheet */
.tl{background:var(--surface);border-radius:var(--r);padding:6px 16px}
.step{display:flex;gap:14px;padding:11px 0;position:relative}
.step .n{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;background:var(--surface);position:relative;z-index:1;color:#fff}
.step .n svg{width:12px;height:12px;stroke-width:3}
.step:not(:last-child)::after{content:"";position:absolute;left:10px;top:33px;bottom:-11px;width:2px;background:var(--line)}
.step.done .n{background:var(--ink);border-color:var(--ink)}
.step.done:not(:last-child)::after{background:var(--ink)}
.step.now .n{border-color:var(--blue);background:var(--blue-soft)}
.step.now.risk .n{border-color:var(--amber);background:var(--amber-soft)}
.step.now.late .n{border-color:var(--red);background:var(--red-soft)}
.step .t{font-size:15.5px}
.step:not(.done):not(.now) .t{color:var(--ink3)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.kv div{background:var(--surface);padding:11px 14px}
.kv span{display:block;font-size:13px;color:var(--ink3)}
.kv b{font-weight:600;font-size:15.5px}

/* certificate */

.cert .cn{font-size:17px;font-weight:700;letter-spacing:-.01em}
.cert .ca{color:var(--ink2);font-size:12px;margin-top:3px;line-height:1.45}
.cert h4{font-size:15px;font-weight:700;margin-bottom:2px}
.cert table{width:100%;border-collapse:collapse;margin:14px 0}
.cert th{text-align:left;font-weight:500;color:var(--ink3);font-size:12px;padding:0 0 6px;border-bottom:1px solid var(--line)}
.cert td{padding:8px 0;border-bottom:1px solid var(--line)}
.cert td:not(:first-child),.cert th:not(:first-child){text-align:right}
.cert .ok{color:var(--green);font-weight:700}
.cert .foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:18px;color:var(--ink2);font-size:12px;gap:10px}
.stamp{border:2px solid var(--green);color:var(--green);font-weight:700;border-radius:8px;padding:5px 10px;font-size:13px;transform:rotate(-4deg)}

.wa{border-radius:var(--r);overflow:hidden;background:#EBE5DC}
.wah{background:#0B6B5C;color:#fff;display:flex;align-items:center;gap:10px;padding:11px 14px}
.wah .av{width:34px;height:34px;border-radius:50%;background:#fff;color:#0B6B5C;display:grid;place-items:center;font-weight:700;font-size:13px}
.wah b{font-weight:600;font-size:15.5px;display:block}
.wah small{font-size:12.5px;opacity:.8}
.wab{padding:14px 12px 10px;display:flex;flex-direction:column;gap:8px;min-height:260px}

.msg.me{background:#D7F7C8;border-radius:10px 10px 3px 10px;align-self:flex-end}
.msg time{display:block;text-align:right;font-size:11px;color:#8A9399;margin-top:2px}
.qr{display:flex;flex-wrap:wrap;gap:7px;padding:2px 12px 14px}
.qr button{background:#fff;color:#0B6B5C;font-weight:600;font-size:14px;padding:8px 12px;border-radius:18px;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.typing{display:flex;gap:4px;padding:12px 14px}
.typing i{width:7px;height:7px;border-radius:50%;background:#9AA3A8;animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}

.wacard{display:flex;align-items:center;gap:14px;background:#0B6B5C;color:#fff;border-radius:var(--r);padding:16px;width:100%;text-align:left;margin-top:28px}
.wacard .ic{background:rgba(255,255,255,.16);color:#fff;width:40px;height:40px;border-radius:12px}
.wacard .ic svg{width:22px;height:22px}
.wacard .d{color:rgba(255,255,255,.78)}
.wacard .chev{color:rgba(255,255,255,.6)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(248,249,250,.86);backdrop-filter:saturate(1.8) blur(20px);-webkit-backdrop-filter:saturate(1.8) blur(20px);border-top:1px solid rgba(0,0,0,.07);display:flex;padding:6px 6px calc(6px + var(--safe-b))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;color:var(--ink3);font-size:11px;font-weight:500;position:relative}
.tab.on{color:var(--blue)}
.tab .pip{position:absolute;top:1px;left:calc(50% + 8px);min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}

.toast{position:fixed;left:50%;bottom:calc(var(--tab) + var(--safe-b) + 18px);transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:13px;font-size:14.5px;font-weight:500;display:flex;gap:8px;align-items:center;opacity:0;transition:all .25s;z-index:60;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast svg{color:#7EE2A2;width:18px;height:18px}
.empty{padding:28px 16px;text-align:center;color:var(--ink3);font-size:15px}
.note{font-size:13px;color:var(--ink3);text-align:center;margin:30px 0 0}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:r .7s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.two>*+*{margin-top:0}

/* desktop */
@media (min-width:960px){
  .tabbar{display:none}
  .side{display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;width:236px;padding:26px 14px;background:var(--surface);border-right:1px solid var(--line)}
  .brand{padding:0 10px 26px}
  .brand b{display:block;font-size:17px;font-weight:700;letter-spacing:-.015em}
  .brand span{font-size:13.5px;color:var(--ink3)}
  .nav{display:flex;align-items:center;gap:11px;padding:10px 10px;border-radius:10px;font-size:15.5px;font-weight:500;color:var(--ink2);width:100%;text-align:left}
  .nav:hover{background:var(--fill)}
  .nav.on{background:var(--blue-soft);color:var(--blue)}
  .nav .pip{margin-left:auto;background:var(--red);color:#fff;font-size:11.5px;font-weight:700;border-radius:9px;padding:1px 7px}
  .side .by{margin-top:auto;padding:0 10px;font-size:12.5px;color:var(--ink3)}
  main{margin-left:236px;max-width:none;padding:30px 40px 60px}
  .view{max-width:1080px}
  .top .co{display:none}
  .top{justify-content:flex-end;height:0;margin:0}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;align-items:start}
  .stats{grid-template-columns:repeat(4,1fr)}
  .toast{bottom:28px}
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:560px;max-height:86vh;border-radius:20px;transform:translate(-50%,-46%) scale(.98);opacity:0;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s}
  .sheet-wrap.open .sheet{transform:translate(-50%,-50%);opacity:1}
  .grab{display:none}
  .sh{padding-top:16px}
  .wacard{max-width:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  const b=$('#wab'); if(!b) return;
  const t=new Date(); const tm='8:0'+(1+b.children.length%8)+' pm';
  b.insertAdjacentHTML('beforeend',`<div class="msg me">${k}<time>${tm}</time></div><div class="msg typing" id="typ"><i></i><i></i><i></i></div>`);
  b.lastElementChild.scrollIntoView({block:'end',behavior:'smooth'});
  waT=setTimeout(()=>{const ty=$('#typ');if(!ty)return;ty.outerHTML=`<div class="msg">${WA_Q[k].replace(/\*(.+?)\*/g,'<b>$1</b>')}<time>${tm}</time></div>`;
    if(k==='Who owes us?'&&!$('#qr [data-q="remind"]'))$('#qr').insertAdjacentHTML('afterbegin','<button data-q="remind">remind</button>');
    if(k==='remind'){INV.filter(i=>i.d>30).forEach(i=>paid.add(i.id));}
    b.lastElementChild.scrollIntoView({block:'end',behavior:'smooth'})},850);
}

/* ---------- toast ---------- */
let tT;
function toast(m){const t=$('#toast');t.innerHTML=ic('check')+m;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),2300)}

/* ---------- nav ---------- */
const TABS=[['today','Today','today'],['jobs','Jobs','jobs',late.length+risk.length],['vendors','Vendors','vendors',vLate.length],['money','Money','money'],['quality','Quality','quality',pendQC.length]];
let cur='today';
function render(){
  $('#main').innerHTML=`<div class="top"><span class="co">Inland Machine Tools</span><span class="demo">Sample data</span></div>`+TABS.map(([k])=>`<section class="view ${k===cur?'on':''}" id="v-${k}">${k===cur?V[k]():''}</section>`).join('');
  const pc=k=>k==='quality'?QC.filter(q=>q.st==='pending').length:TABS.find(t=>t[0]===k)[3];
  $('#tabbar').innerHTML=TABS.map(([k,n,i])=>`<button class="tab ${k===cur?'on':''}" data-go="${k}" aria-label="${n}">${ic(i)}${n}${pc(k)?`<span class="pip num">${pc(k)}</span>`:''}</button>`).join('');
  $('#sidenav').innerHTML=TABS.map(([k,n,i])=>`<button class="nav ${k===cur?'on':''}" data-go="${k}">${ic(i)}${n}${pc(k)?`<span class="pip num">${pc(k)}</span>`:''}</button>`).join('');
  if(cur==='jobs'){drawJobs();const inp=$('#jq');inp.addEventListener('input',e=>{jq=e.target.value;drawJobs()})}
}
function go(k){if(!V[k])k='today';cur=k;render();window.scrollTo({top:0});try{if(location.hash!=='#'+k)history.replaceState(null,'','#'+k)}catch(e){}}
window.addEventListener('hashchange',()=>{const k=location.hash.slice(1);if(V[k]&&k!==cur)go(k)});

document.addEventListener('click',e=>{
  const el=e.target.closest('button,[data-close]'); if(!el) return;
  const d=el.dataset;
  if('close' in d){closeSheet();return}
  if(d.go){closeSheet();go(d.go);return}
  if(d.job){jobSheet(d.job);return}
  if(d.f){jf=d.f;document.querySelectorAll('#chips .chip').forEach(c=>c.classList.toggle('on',c.dataset.f===jf));drawJobs();return}
  if(d.remind){const v=VENDORS.find(x=>x.id===d.remind);sent.add(v.id);el.classList.add('done');el.innerHTML=ic('check','i s')+'Reminder sent';toast(`WhatsApp reminder sent to ${v.n}`);return}
  if(d.recv){const v=VENDORS.find(x=>x.id===d.recv);el.classList.add('done');el.innerHTML=ic('check','i s')+'Received';toast(`${v.item} back from ${v.n}`);return}
  if(d.pay){paid.add(d.pay);el.classList.add('done');el.textContent='Reminded';const i=INV.find(x=>x.id===d.pay);toast(`Payment reminder sent to ${i.c}`);return}
  if(d.gen){genCert(d.gen,el);return}
  if(d.cert){openSheet('Certificate',certHTML(d.cert));return}
  if(d.sendcert){toast(`Certificate emailed to ${d.sendcert}`);return}
  if(d.update){const j=JOBS.find(x=>x.id===d.update);toast(`Status sent to ${j.client} on WhatsApp`);return}
  if('wa' in d){waSheet();return}
  if(d.q){el.remove();waAsk(d.q);return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
$('.close').innerHTML=ic('x');
go((location.hash||'').slice(1)||'today');
</script>
</body>
</html>
